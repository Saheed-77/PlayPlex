server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Names and notes are UTF-8; say so or browsers guess.
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── the API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── the live stream ──────────────────────────────────────────────────────
    # A buffering proxy is the single easiest way to break SSE: nginx holds each event
    # until its buffer fills, so the floor updates in bursts minutes apart, or not at
    # all. Buffering off, no upstream cache, and a read timeout longer than the event —
    # the connection is *meant* to sit open all evening doing nothing.
    location = /api/stream {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP  $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # ── static files ─────────────────────────────────────────────────────────
    # Vite fingerprints these, so they can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: a stale one points at assets that no longer
    # exist, and the staff device shows a blank screen after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /floor and /admin/reports are React routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
