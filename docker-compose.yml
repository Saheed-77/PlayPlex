# The event-day stack (docs/06 §9). Runs identically on the LAN laptop and a cloud VM —
# the only difference is which `.env` you point it at.
#
#   docker compose up -d db                      # just the database, for ./mvnw spring-boot:run
#   docker compose --env-file .env.event up -d   # the whole stack, on event day

services:
  db:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00 # UTC, always
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-playplex}
      MYSQL_USER: ${DB_USER:-playplex}
      MYSQL_PASSWORD: ${DB_PASSWORD:-playplex}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
    ports:
      # Exposed so the app can run from the IDE against the same database.
      # 3306 is often taken by a locally installed MySQL, so the container uses 3307.
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-rootpw}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      # All three UTC settings are in this file: the server's --default-time-zone above,
      # connectionTimeZone here, and -Duser.timezone in the image (docs/03 §3.3).
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://db:3306/${DB_NAME:-playplex}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-playplex}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-playplex}
      # Override this. The dev default in application.yml signs tokens anyone can forge.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes-long}
      # The UI is served same-origin through nginx, so no browser origin needs allowing.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JWT_SECURE_COOKIE: ${JWT_SECURE_COOKIE:-false}
    expose:
      - '8080'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysqldata:
