# The event-day stack (docs/06 §9). Runs identically on the LAN laptop and a cloud VM.
# `api` and `web` are added in the packaging phase, once their Dockerfiles exist; until
# then this brings up the database that `./mvnw spring-boot:run` and the tests talk to.

services:
  db:
    image: mysql:8.4
    command:
      - --default-time-zone=+00:00 # UTC, always
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-playplex}
      MYSQL_USER: ${DB_USER:-playplex}
      MYSQL_PASSWORD: ${DB_PASSWORD:-playplex}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
    ports:
      # Exposed so the app can run from the IDE against the same database.
      # 3306 is often taken by a locally installed MySQL, so the container uses 3307.
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-rootpw}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysqldata:
